jobs:
  sync-mirror:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Update mirror
        uses: projg2/golang-dist-mirror-action@v1
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          upstream-repo: https://codeberg.org/emersion/hydroxide.git
name: Sync with upstream
on:
  push:
  schedule:
    - cron: 11 */6 * * *
  workflow_dispatch:
